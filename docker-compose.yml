x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  working_dir: /tmp          # les .log relatifs (FileHandler) sont écrits ici
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  mem_limit: 512m
  cpus: 1.0
  pids_limit: 200
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  signal_cli:
    profiles: ["signal"]      # optionnel : lancé seulement avec --profile signal
    build: ./services/signal_cli
    container_name: signal_cli
    volumes:
      - ./data/signal-cli:/home/.local/share/signal-cli
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 300
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cert-net
      - egress

  alert_service:
    <<: *hardened
    build: ./services/alert_service
    container_name: alert_service
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5005
      - DEDUP_WINDOW_MINUTES=30
      - SIGNAL_API_URL=http://signal_cli:8080
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - ALERT_EMAIL_FROM=${ALERT_EMAIL_FROM:-}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
      - SIGNAL_CLI_NUMBER=${SIGNAL_CLI_NUMBER:-}
      - SIGNAL_CLI_GROUP_ID=${SIGNAL_CLI_GROUP_ID:-}
    volumes:
      - ./data/outputs/alert_service:/data/outputs
    networks:
      - cert-net
      - egress

  web_watcher:
    <<: *hardened
    build: ./services/web_watcher
    container_name: web_watcher
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5001
      - SCHEDULE_INTERVAL_MINUTES=${WEB_WATCHER_INTERVAL:-15}
    volumes:
      - ./data/inputs:/data/inputs:ro
      - ./data/outputs/web_watcher:/data/outputs
    depends_on:
      - alert_service
    networks:
      - cert-net
      - egress

  vuln_scanner:
    <<: *hardened
    mem_limit: 1g
    build: ./services/vuln_scanner
    container_name: vuln_scanner
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5002
      - SCHEDULE_INTERVAL_HOURS=${VULN_SCANNER_INTERVAL:-24}
      - NVD_API_KEY=${NVD_API_KEY:-}
    volumes:
      - ./data/inputs:/data/inputs:ro
      - ./data/outputs/vuln_scanner:/data/outputs
    depends_on:
      - alert_service
    networks:
      - cert-net
      - egress

  ransomware_monitor:
    <<: *hardened
    build: ./services/ransomware_monitor
    container_name: ransomware_monitor
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5003
      - SCHEDULE_INTERVAL_HOURS=${VULN_SCANNER_INTERVAL:-24}
    volumes:
      - ./data/inputs:/data/inputs:ro
      - ./data/outputs/ransomware_monitor:/data/outputs
    depends_on:
      - alert_service
    networks:
      - cert-net
      - egress

  social_monitor:
    <<: *hardened
    build: ./services/social_monitor
    container_name: social_monitor
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5004
      - SCHEDULE_INTERVAL_MINUTES=${SOCIAL_INTERVAL:-60}
    volumes:
      - ./data/inputs:/data/inputs:ro
      - ./data/outputs/social_monitor:/data/outputs
    depends_on:
      - alert_service
    networks:
      - cert-net
      - egress

  dashboard:
    <<: *hardened
    build: ./dashboard
    container_name: dashboard
    ports:
      - "127.0.0.1:8050:8050"     # jamais accessible depuis le LAN
    environment:
      - WATCHER_URL=http://web_watcher:5001/api/data
      - VULN_URL=http://vuln_scanner:5002/api/data
      - RANSOMWARE_URL=http://ransomware_monitor:5003/api/data
      - SOCIAL_URL=http://social_monitor:5004/api/data
      - CARTO_API_KEY=${CARTO_API_KEY:-}
      - WEB_WATCHER_INTERVAL=${WEB_WATCHER_INTERVAL:-15}
      - VULN_SCANNER_INTERVAL=${VULN_SCANNER_INTERVAL:-24}
      - DEDUP_WINDOW_MINUTES=30
    depends_on:
      - web_watcher
      - vuln_scanner
      - ransomware_monitor
      - social_monitor
    networks:
      - cert-net
      - front

networks:
  cert-net:
    name: cert-net
    internal: true            # communication entre services uniquement, pas d'Internet
  egress:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24   # sous-réseau fixe
  front: {}                   # réseau non interne, nécessaire pour publier 127.0.0.1:8050