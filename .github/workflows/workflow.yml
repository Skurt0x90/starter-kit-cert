name: Tests

on: [push, pull_request]

permissions:
  contents: read   # le workflow n'a besoin que de lire le repo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/web_watcher/requirements.txt
          pip install -r services/alert_service/requirements.txt
          pip install pytest pytest-mock pytest-cov

      - name: Run unit tests
        working-directory: services
        run: |
          pytest web_watcher/tests alert_service/tests \
            --cov=web_watcher --cov=alert_service \
            --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: services/coverage.xml
          fail_ci_if_error: true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Bandit - analyse sécurité statique
        run: |
          bandit -r services dashboard -ll \
            --exclude "*/tests/*"

      - name: pip-audit - vulnérabilités dépendances
        run: |
          for f in services/*/requirements.txt dashboard/requirements.txt; do
            echo "== $f"
            pip-audit -r "$f"
          done