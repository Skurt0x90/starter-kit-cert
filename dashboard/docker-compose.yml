services:
  dashboard:
    build: .
    container_name: dashboard
    ports:
      - "127.0.0.1:8050:8050"     # jamais accessible depuis le LAN
    environment:
      - WATCHER_URL=http://web_watcher:5001/api/data
      - VULN_URL=http://vuln_scanner:5002/api/data
      - RANSOMWARE_URL=http://ransomware_monitor:5003/api/data
      - SOCIAL_URL=http://social_monitor:5004/api/data
      - CARTO_API_KEY=${CARTO_API_KEY:-}
      - WEB_WATCHER_INTERVAL=${WEB_WATCHER_INTERVAL:-15}
      - VULN_SCANNER_INTERVAL=${VULN_SCANNER_INTERVAL:-24}
      - DEDUP_WINDOW_MINUTES=30
    read_only: true
    working_dir: /tmp
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 200
    restart: unless-stopped
    networks:
      - cert-net
      - front

networks:
  cert-net:
    external: true
  front: {}     # réseau non interne, nécessaire pour publier le port sur 127.0.0.1